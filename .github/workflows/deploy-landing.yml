name: Deploy site

# Manual on purpose: GitHub Pages must be set to "GitHub Actions" as its source
# (Settings -> Pages -> Build and deployment) before this can publish anything.
# See the Deployment section of the README.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build landing page
        run: pnpm --filter @skeleton-crew/landing build
        env:
          VITE_ASSISTANT_URL: ./assistant/

      - name: Build assistant console
        run: pnpm --filter @skeleton-crew/assistant build
        env:
          VITE_LANDING_URL: ../

      - name: Publish both apps as one static site
        run: |
          mkdir -p apps/landing/dist/assistant
          cp -r apps/assistant/dist/. apps/landing/dist/assistant/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
